# Deploys the Fair Dinkum online service (worker/) to Cloudflare.
# Needs these repository secrets (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SETUP_CODE, BREVO_API_KEY, SENDER_EMAIL
# The first run creates an EU-only D1 database called "fair-dinkum".
name: Online service
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/online-service.yml"]
  workflow_dispatch:
concurrency: online-service
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SETUP_CODE: ${{ secrets.SETUP_CODE }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are there
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SETUP_CODE BREVO_API_KEY SENDER_EMAIL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.152.0
      - name: Create the EU database (first run only)
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="fair-dinkum");process.stdout.write(d?d.uuid:"")'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create fair-dinkum --jurisdiction eu; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::Couldn't create or find the D1 database"; exit 1; fi
          sed -i "s/REPLACE_WITH_DATABASE_ID/$ID/" wrangler.toml
          echo "Database: $ID"
      - name: Set up tables
        run: npx wrangler d1 execute fair-dinkum --remote --file schema.sql -y
      - name: Deploy
        run: npx wrangler deploy | tee deploy.log
      - name: Store secrets
        run: |
          printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE
          printf '%s' "$BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY
          printf '%s' "$SENDER_EMAIL" | npx wrangler secret put SENDER_EMAIL
      - name: Service address
        run: grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1 | sed 's/^/SERVICE_URL=/'
